[package]
name = "jingyun-dsh-client"
version = "0.1.1"
description = "Jingyun DSH Desktop Client"
authors = ["Jingyun Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = ["tray-icon", "unstable", "image-ico"] }
tauri-plugin-opener = "2.0.0-rc"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
pelite = "0.10.0"
ico = "0.5.0"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 2
