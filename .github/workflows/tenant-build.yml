name: 'Tenant Build'

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: '租户唯一ID'
        required: true
        default: ''
      product_name:
        description: '租户客户端名称'
        required: true
        default: 'AI Studio'
      logo_url:
        description: '租户Logo下载地址'
        required: false
        default: ''
      domain:
        description: '租户后台或API域名'
        required: false
        default: ''
      tag:
        description: '构建指定的Git Tag版本(留空则自动选取最新tag)'
        required: false
        default: ''
      webhook_url:
        description: '构建完成通知后端的Webhook完整地址'
        required: true
      webhook_secret:
        description: 'Webhook通信密钥'
        required: false
        default: ''
  repository_dispatch:
    types: [tenant-build]

jobs:
  prepare-tenant-context:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tenant_id: ${{ steps.resolve.outputs.tenant_id }}
      product_name: ${{ steps.resolve.outputs.product_name }}
      logo_url: ${{ steps.resolve.outputs.logo_url }}
      domain: ${{ steps.resolve.outputs.domain }}
      version: ${{ steps.resolve.outputs.version }}
      target_tag: ${{ steps.resolve.outputs.target_tag }}
      webhook_url: ${{ steps.resolve.outputs.webhook_url }}
      webhook_secret: ${{ steps.resolve.outputs.webhook_secret }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Tag and Parameters
        id: resolve
        run: |
          TENANT_ID="${{ github.event.client_payload.tenant_id || github.event.inputs.tenant_id }}"
          PRODUCT_NAME="${{ github.event.client_payload.product_name || github.event.inputs.product_name }}"
          LOGO_URL="${{ github.event.client_payload.logo_url || github.event.inputs.logo_url }}"
          DOMAIN="${{ github.event.client_payload.domain || github.event.inputs.domain }}"
          CUSTOM_TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"

          if [ -n "$CUSTOM_TAG" ]; then
            TARGET_TAG="$CUSTOM_TAG"
          else
            TARGET_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          if [ -n "$TARGET_TAG" ]; then
            echo "Building on tag: $TARGET_TAG"
            git checkout "$TARGET_TAG"
          fi

          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          WEBHOOK_URL="${{ github.event.client_payload.webhook_url || github.event.inputs.webhook_url }}"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Error: webhook_url is required but not provided."
            exit 1
          fi
          WEBHOOK_SECRET="${{ github.event.client_payload.webhook_secret || github.event.inputs.webhook_secret }}"
          if [ -n "$WEBHOOK_SECRET" ]; then
            echo "::add-mask::$WEBHOOK_SECRET"
          fi
          echo "tenant_id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "product_name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "logo_url=$LOGO_URL" >> $GITHUB_OUTPUT
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          echo "webhook_url=$WEBHOOK_URL" >> $GITHUB_OUTPUT
          echo "webhook_secret=$WEBHOOK_SECRET" >> $GITHUB_OUTPUT
      - name: Notify Backend Build Started
        run: |
          WEBHOOK_URL="${{ steps.resolve.outputs.webhook_url }}"
          WEBHOOK_SECRET="${{ steps.resolve.outputs.webhook_secret }}"
          TENANT_ID="${{ steps.resolve.outputs.tenant_id }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          RUN_ID="${{ github.run_id }}"

          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
              -d "{\"tenant_id\":\"$TENANT_ID\",\"run_id\":\"$RUN_ID\",\"version\":\"$VERSION\",\"status\":\"building\"}" || true
          fi

  build-tenant-clients:
    needs: [prepare-tenant-context]
    env:
      TENANT_ID: ${{ needs.prepare-tenant-context.outputs.tenant_id }}
      VERSION: ${{ needs.prepare-tenant-context.outputs.version }}
      TARGET_TAG: ${{ needs.prepare-tenant-context.outputs.target_tag }}
      PRODUCT_NAME: ${{ needs.prepare-tenant-context.outputs.product_name }}
      LOGO_URL: ${{ needs.prepare-tenant-context.outputs.logo_url }}
      DOMAIN: ${{ needs.prepare-tenant-context.outputs.domain }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            arch: 'aarch64'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            arch: 'x86_64'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            arch: 'x86_64'
            args: '--no-bundle'
          - platform: 'windows-latest'
            arch: 'x64'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tenant-context.outputs.target_tag }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: remove patches for release
        shell: bash
        run: |
          rm -rf patches
          python -c "p='pnpm-workspace.yaml'; open(p,'w',encoding='utf-8').write(open(p,encoding='utf-8').read().split('patchedDependencies:')[0])"

      - name: install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # 动态配置租户品牌、图标及专属信息
      - name: apply tenant branding
        shell: bash
        run: |
          # 1. 若提供 Logo，下载租户 Logo 并自动生成全尺寸图标
          if [ -n "${{ env.LOGO_URL }}" ]; then
            curl -sSL "${{ env.LOGO_URL }}" -o tenant_logo.png
            pnpm tauri icon tenant_logo.png
          fi

          # 2. 写入 desktop-config.json
          cat <<EOF > packages/jingyun-dsh/desktop-config.json
          {
            "custom_name": "${{ env.PRODUCT_NAME }}",
            "custom_logo": "${{ env.LOGO_URL }}",
            "domain": "${{ env.DOMAIN }}"
          }
          EOF

          # 3. 动态调整 tauri.conf.json
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf-8"));
            cfg.productName = process.env.PRODUCT_NAME;
            if (cfg.app && cfg.app.windows && cfg.app.windows[0]) {
              cfg.app.windows[0].title = process.env.PRODUCT_NAME;
            }
            cfg.identifier = "com.tenant." + process.env.TENANT_ID.replace(/[^a-zA-Z0-9]/g, "");
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2), "utf-8");
          '

      - name: Cache runtimes (node & python)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/vendor/node
            src-tauri/resources/vendor/python
          key: runtimes-${{ matrix.platform }}-${{ matrix.arch || 'default' }}-${{ hashFiles('scripts/download_runtimes.js') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-all-targets: 'true'

      - name: build
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy windows to release assets
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp "src-tauri/target/release/bundle/nsis/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_x64-setup.exe" "artifacts/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_windows_x64-setup.exe"
          cd src-tauri/target/release
          if [ -f "jingyun-dsh-client.exe" ] && [ ! -f "${{ env.PRODUCT_NAME }}.exe" ]; then
            cp "jingyun-dsh-client.exe" "${{ env.PRODUCT_NAME }}.exe"
          fi
          if [ ! -d "resources" ] && [ -d "../../resources" ]; then
            cp -r ../../resources resources
          fi
          rm -rf data
          mkdir -p data
          rm -f "${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_windows_x64.zip"
          7z a "${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_windows_x64.zip" "${{ env.PRODUCT_NAME }}.exe" resources data
          cd -
          cp "src-tauri/target/release/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_windows_x64.zip" "artifacts/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_windows_x64.zip"

      - name: Copy linux to release assets
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/release
          if [ -f "jingyun-dsh-client" ] && [ ! -f "${{ env.PRODUCT_NAME }}" ]; then
            cp "jingyun-dsh-client" "${{ env.PRODUCT_NAME }}"
          fi
          if [ ! -d "resources" ] && [ -d "../../resources" ]; then
            cp -r ../../resources resources
          fi
          rm -rf data
          mkdir -p data
          EXTRA_ITEMS="data"
          if [ -d "resources" ]; then
            EXTRA_ITEMS="resources data"
          fi
          tar -czf "${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_linux_amd64.tar.gz" "${{ env.PRODUCT_NAME }}" $EXTRA_ITEMS
          cd -
          cp "src-tauri/target/release/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_linux_amd64.tar.gz" "artifacts/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_linux_amd64.tar.gz"

      - name: Copy macos to release assets
        if: matrix.platform == 'macos-latest'
        env:
          ARCH_ALIAS: ${{ matrix.arch == 'x86_64' && 'x64' || matrix.arch }}
        run: |
          cp "src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_${{ env.ARCH_ALIAS }}.dmg" "artifacts/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_macos_${{ matrix.arch }}.dmg"
          cd "src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/macos"
          if [ -d "${{ env.PRODUCT_NAME }}.app" ]; then
            zip -r -y "$GITHUB_WORKSPACE/artifacts/${{ env.PRODUCT_NAME }}_${{ env.VERSION }}_macos_${{ matrix.arch }}.zip" "${{ env.PRODUCT_NAME }}.app"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tenant-${{ env.TENANT_ID }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*

  upload-to-oss:
    needs: [build-tenant-clients, prepare-tenant-context]
    runs-on: ubuntu-latest
    env:
      TENANT_ID: ${{ needs.prepare-tenant-context.outputs.tenant_id }}
      VERSION: ${{ needs.prepare-tenant-context.outputs.version }}
      TARGET_TAG: ${{ needs.prepare-tenant-context.outputs.target_tag }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Setup ossutil
        if: env.OSS_ACCESS_KEY_ID != ''
        uses: manyuanrong/setup-ossutil@v2.0
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Upload to Aliyun OSS
        if: env.OSS_ACCESS_KEY_ID != ''
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          ossutil cp -r -f dist/ oss://${OSS_BUCKET}/tenants/${TENANT_ID}/
          echo "Files uploaded to oss://${OSS_BUCKET}/tenants/${TENANT_ID}/"

      - name: Notify Backend via Webhook
        env:
          BACKEND_WEBHOOK_URL: ${{ needs.prepare-tenant-context.outputs.webhook_url }}
          BACKEND_WEBHOOK_SECRET: ${{ needs.prepare-tenant-context.outputs.webhook_secret }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          node -e '
            const fs = require("fs");
            const https = require("https");
            const tenantId = process.env.TENANT_ID;
            const bucket = process.env.OSS_BUCKET;
            const endpoint = process.env.OSS_ENDPOINT;
            const baseUrl = `https://${bucket}.${endpoint}/tenants/${tenantId}`;
            
            const files = fs.readdirSync("dist");
            const downloads = {};
            
            for (const f of files) {
              const fullUrl = `${baseUrl}/${encodeURIComponent(f)}`;
              if (f.endsWith("-setup.exe")) downloads.windows_setup = fullUrl;
              else if (f.endsWith("_windows_x64.zip")) downloads.windows_zip = fullUrl;
              else if (f.endsWith("_macos_aarch64.dmg")) downloads.macos_dmg_arm64 = fullUrl;
              else if (f.endsWith("_macos_aarch64.zip")) downloads.macos_zip_arm64 = fullUrl;
              else if (f.endsWith("_macos_x86_64.dmg")) downloads.macos_dmg_x64 = fullUrl;
              else if (f.endsWith("_macos_x86_64.zip")) downloads.macos_zip_x64 = fullUrl;
              else if (f.endsWith(".deb")) downloads.linux_deb = fullUrl;
              else if (f.endsWith(".rpm")) downloads.linux_rpm = fullUrl;
              else if (f.endsWith(".tar.gz")) downloads.linux_tar_gz = fullUrl;
            }
            
            const payload = {
              tenant_id: tenantId,
              run_id: "${{ github.run_id }}",
              version: process.env.VERSION,
              tag: process.env.TARGET_TAG,
              status: "success",
              base_url: `${baseUrl}/`,
              downloads: downloads,
              files: files
            };

            const data = JSON.stringify(payload);
            const req = https.request(new URL(process.env.BACKEND_WEBHOOK_URL), {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(data),
                "X-Webhook-Secret": process.env.BACKEND_WEBHOOK_SECRET
              }
            }, (res) => {
              if (res.statusCode !== 200) {
                console.error("Webhook returned error status:", res.statusCode);
                process.exit(1);
              }
              res.pipe(process.stdout);
            });

            req.on("error", (e) => {
              console.error("Webhook request failed:", e);
              process.exit(1);
            });

            req.write(data);
            req.end();
          '

  notify-failure:
    needs: [build-tenant-clients, prepare-tenant-context]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Backend On Build Failure
        env:
          BACKEND_WEBHOOK_URL: ${{ needs.prepare-tenant-context.outputs.webhook_url }}
          BACKEND_WEBHOOK_SECRET: ${{ needs.prepare-tenant-context.outputs.webhook_secret }}
          TENANT_ID: ${{ needs.prepare-tenant-context.outputs.tenant_id }}
          VERSION: ${{ needs.prepare-tenant-context.outputs.version }}
        run: |
          if [ -n "$BACKEND_WEBHOOK_URL" ]; then
            curl -s -X POST "${BACKEND_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${BACKEND_WEBHOOK_SECRET}" \
              -d "{\"tenant_id\":\"${TENANT_ID}\",\"run_id\":\"${{ github.run_id }}\",\"version\":\"${VERSION}\",\"status\":\"failure\",\"error\":\"GitHub Actions 客户端打包失败\"}" || true
          fi
